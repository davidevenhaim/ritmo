name: ritmo
description: "Ritmo - a social workout app."
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  health: ^13.3.2
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
  fonts:
    # Inter variable font (SIL OFL 1.1, assets/fonts/Inter-OFL.txt). The
    # Nocturne design system asks for Inter 400/500/600; the variable file
    # covers all three through weight axis instances.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    # Phosphor regular, the icon set the Nocturne design calls for (MIT,
    # assets/fonts/Phosphor-LICENSE.txt). Vendored as a font rather than
    # pulled from phosphor_flutter, which does not build on Flutter 3.47:
    # its PhosphorIconData extends IconData, now a final class.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
